<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>اولین پروژه من</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>سلام من دارم HTML,CSS و گیت یاد می گیرم.</h1>
    <p>این اولین پروژه واقعی من است و دارم گیت یاد می گیرم.</p>

  
<div class="profile-card">
    <h2>درباره من</h2>
    <p>من در حال یادگیری توسعه وب هستم.</p>

    <button onclick="showMessage()">بیشتر بدانید</button>
    <p id="message"></p>

    <input type="text" id="username" placeholder="نامت را وارد کن">
    <button onclick="greetUser()">نمایش خوشامدگویی</button>
    <p id="greeting"></p>
</div>
<script>
    function showMessage() {
        document.getElementById("message").textContent =
            "به وب‌سایت من خوش آمدید!";
    }
    function greetUser() {
    const name = document.getElementById("username").value.trim();

    if (name === "") {
        alert("لطفاً نامت را وارد کن.");
        return;
    }

    document.getElementById("greeting").textContent =
        "سلام " + name + " عزیز! به صفحه من خوش آمدی.";
}
</script>
</body>
</html>
